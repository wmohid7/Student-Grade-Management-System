<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Grade-System</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <!-- header -->
    <header class="header">
        <h1>STUDENT GRADE MANAGEMENT SYSTEM</h1>

        <p>Manage Student Records Efficiently</p>

    </header>
    <!-- main container  -->
    <main class="container">

        <section class="top-section">

            <!-- student form  -->
            <div class="student-form">

                <h2>Add Student</h2>

                <form id="studentForm">

                    <label for="name">Student Name</label>
                    <input type="text" id="name" placeholder="Enter Your Name">

                    <label for="roll">Roll Number</label>
                    <input type="number" id="roll" placeholder="Enter Your Roll Number">

                    <label for="marks">Marks</label>
                    <input type="number" id="marks" placeholder="Enter Marks">

                    <button type="button" id="addBtn">
                        Add Student
                    </button>
                    <!-- Bonus Feature -->
                    <button type="button" id="resetBtn" onclick="resetForm()">
                        Reset Form
                    </button>

                </form>
            </div>

            <!-- Dashboard -->

            <div class="dashboard">
                <h2>Dashboard</h2>

                <div class="dashboard-grid">

                    <div class="card">
                        <h3>Total Students</h3>
                        <p id="TOTAL">0</p>
                    </div>

                    <div class="card">
                        <h3>AVERAGE</h3>
                        <p id="AVERAGE">0</p>
                    </div>

                    <div class="card">
                        <h3>HIGHEST</h3>
                        <p id="HIGHEST">0</p>
                    </div>

                    <div class="card">
                        <h3>LOWEST</h3>
                        <p id="LOWEST">0</p>
                    </div>

                    <div class="card">
                        <h3>PASSED</h3>
                        <p id="PASSED">0</p>
                    </div>

                    <div class="card">
                        <h3>FAILED</h3>
                        <p id="FAILED">0</p>
                    </div>

                </div>

            </div>

        </section>

        <!-- Student table -->

        <section class="table-section">
            <div class="table-top">
                <input type="text" id="search" class="table-search" placeholder="Search....">

                <select id="filterSort" onchange="handleSelection()">

                    <option value="">Select Option</option>
                    <option value="MarksAsc">Sort Marks ↑</option>
                    <option value="MarksDesc">Sort Marks ↓</option>
                    <option value="name">Sort Name A-Z</option>
                    <option value="all">Show All</option>
                    <option value="Passed">Show Passed</option>
                    <option value="failed">Show Failed</option>

                </select>

            </div>

            <h2>STUDENT RECORDS</h2>

            <table>
                <thead>
                    <tr>

                        <th>Roll No</th>
                        <th>Student Name</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="studentTable">

                </tbody>

            </table>

        </section>

    </main>

    <!-- Footer  -->

    <footer class="footer">

        <p>
            Student Grade Management System

            <br>

            • HTML • CSS • JAVASCRIPT
        </p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
